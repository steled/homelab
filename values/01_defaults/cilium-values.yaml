# for reference check: https://docs.cilium.io/en/stable/helm-reference/

cni:
  exclusive: false

dashboards:
  enabled: true
  label: "grafana_dashboard"
  labelValue: "1"
  namespace: "victoriametrics"

envoy:
  debug:
    admin:
      enabled: false # enable for debugging
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

envoyConfig:
  enabled: true

# enable for debugging
# debug:
#   enabled: true
#   verbose: flow

hubble:
  enabled: true
  metrics:
    dashboards:
      enabled: true
      label: "grafana_dashboard"
      labelValue: "1"
      namespace: "victoriametrics"
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip
      - source_namespace
      - source_workload
      - destination_ip
      - destination_namespace
      - destination_workload
      - traffic_direction
    serviceMonitor:
      enabled: true
  relay:
    enabled: true
    podLabels:
      istio.io/dataplane-mode: none
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  tls:
    auto:
      # the chart default "helm" reuses the existing secrets on every upgrade and never
      # renews them, so the hubble server/relay certs expired after 365 days (2026-11-22)
      # and hubble-relay failed with x509 errors; the certgen CronJob reissues them
      # every 4 months (chart default schedule) with 365 days validity
      method: cronJob
  # tls:
  #   auto:
  #     enabled: true
  #     method: "cert-manager"
  #     certValidityDuration: 90 # 90 days
  #     certManagerIssuerRef:
  #       group: "cert-manager.io"
  #       name: "cloudflare-letsencrypt-production"
  #       kind: "ClusterIssuer"
  ui:
    enabled: true

# ingressController:
#   default: false
#   enabled: false
#   loadbalancerMode: shared
#   service:
#     annotations:
#       "lbipam.cilium.io/ips": "172.16.4.40"

k8sClientRateLimit:
  burst: 100
  qps: 50

kubeProxyReplacement: false

l2announcements:
  enabled: true

# loadBalancer:
#   l7:
#     backend: envoy

gatewayAPI:
  enabled: false
  gatewayClass:
    create: "false"

operator:
  dashboards:
    enabled: true
    label: "grafana_dashboard"
    labelValue: "1"
    namespace: "victoriametrics"
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  replicas: 2

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

socketLB:
  hostNamespaceOnly: true

